# ============================================================
# DNS Compare - Domain Configuration (YAML)
# ============================================================
# Supported record types: A, CNAME, MX, SOA, TXT
# category: optional group label for display and Prometheus stats
# ============================================================

domains:
  - domain: b2enew.bankofchina.com
    type: A
    category: bank_core

  - domain: api.bankofchina.com
    type: A
    category: bank_core

  - domain: morganstanley.com
    type: MX
    category: mail_ms

  - domain: ica.mydesk.morganstanley.com
    type: CNAME
    category: cdn_ica

  # Example: Add extra DNS servers for specific domains
  # - domain: b2enew.bankofchina.com
  #   type: A
  #   category: bank_core
  #   extra_servers:
  #     - InternalDNS1@10.0.0.53
  #     - InternalDNS2@10.0.0.54
  - domain: google.com
    type: TXT
    category: txt_spf


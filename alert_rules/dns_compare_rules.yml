# ============================================================
# Prometheus Alert Rules for DNS Compare
# ============================================================
# Include this in your Prometheus configuration:
#
#   rule_files:
#     - "dns_compare_rules.yml"
# ============================================================

groups:
  - name: dns_compare_alerts
    interval: 60s
    rules:
      # -------------------------------------------------------
      # DNS Resolution Difference
      # Triggers when any DNS server returns different results
      # compared to the baseline (first DNS server)
      # -------------------------------------------------------
      - alert: DNSResolutionDifference
        expr: dns_query_difference{server!=""} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS差异检测 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            DNS服务器 {{ $labels.server }} 对 {{ $labels.domain }}
            的 {{ $labels.record_type }} 记录（含 TXT 自动分类）解析结果与基线不一致。
            请检查 DNS 配置和 GSLB 调度策略。

      # -------------------------------------------------------
      # DNS Query Error
      # Triggers when a DNS server returns an error
      # -------------------------------------------------------
      - alert: DNSQueryError
        expr: dns_query_error == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DNS查询错误 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            DNS服务器 {{ $labels.server }} 对 {{ $labels.domain }}
            的 {{ $labels.record_type }} 记录查询失败。

      # -------------------------------------------------------
      # DNS No Record Found
      # Triggers when a DNS server returns no data for a record
      # -------------------------------------------------------
      - alert: DNSNoRecordFound
        expr: dns_query_nodata == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS无记录 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            DNS服务器 {{ $labels.server }} 对 {{ $labels.domain }}
            的 {{ $labels.record_type }} 记录无数据。

      # -------------------------------------------------------
      # High Query Latency (optional)
      # Triggers when any DNS query exceeds 500ms
      # -------------------------------------------------------
      - alert: DNSHighLatency
        expr: dns_query_duration_ms > 500
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "DNS高延迟 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            DNS服务器 {{ $labels.server }} 对 {{ $labels.domain }}
            的 {{ $labels.record_type }} 记录查询延迟为 {{ $value }}ms。

      # -------------------------------------------------------
      # DNS Record Gone (daemon mode)
      # Triggers when a previously working DNS record disappears
      # -------------------------------------------------------
      - alert: DNSRecordGone
        expr: dns_change_detected{change_type="gone"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DNS记录消失 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            {{ $labels.domain }} 的 {{ $labels.record_type }} 记录在
            DNS服务器 {{ $labels.server }} 上已不存在，可能是配置变更或 GSLB 调度异常。

      # -------------------------------------------------------
      # DNS Record Changed (daemon mode)
      # Triggers when a DNS resolution value changes between rounds
      # -------------------------------------------------------
      - alert: DNSRecordChanged
        expr: dns_change_detected{change_type="change"} == 1
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "DNS记录变更 - {{ $labels.domain }} ({{ $labels.server }})"
          description: >
            {{ $labels.domain }} 的 {{ $labels.record_type }} 记录在
            DNS服务器 {{ $labels.server }} 上发生值变化：{{ $labels.description }}。

      # -------------------------------------------------------
      # Test Run Stale (daemon mode: 3 min threshold)
      # Triggers when no test has run for more than 3 minutes
      # (daemon mode runs every 30-60s)
      # -------------------------------------------------------
      - alert: DNSTestRunStale
        expr: (time() - dns_test_last_run_timestamp) > 180
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "DNS测试任务已停止运行"
          description: >
            DNS对比测试已超过 3 分钟未执行，请检查 daemon 或 cron 任务是否正常。
